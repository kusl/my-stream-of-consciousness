name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MSOC_VERSION_CODE: ${{ github.run_number }}
      MSOC_VERSION_NAME: 1.0.${{ github.run_number }}
      APK_NAME: my-stream-of-consciousness-v1.0.${{ github.run_number }}.apk
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "::error::KEYSTORE_BASE64 secret is not set"; exit 1; fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
          echo "MSOC_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
      - name: Test and assemble
        env:
          MSOC_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          MSOC_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          MSOC_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew testDebugUnitTest :app:assembleRelease --stacktrace
      - run: cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/$APK_NAME"
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ env.MSOC_VERSION_NAME }}
          name: v${{ env.MSOC_VERSION_NAME }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          generate_release_notes: true
          files: ${{ runner.temp }}/${{ env.APK_NAME }}
